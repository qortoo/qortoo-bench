[package]
name = "qortoo-bench-sdk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
qortoo = { path = "../../_sources/rust", features = ["observability"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "counter"
path = "src/bin/counter.rs"

[[bin]]
name = "variable"
path = "src/bin/variable.rs"
