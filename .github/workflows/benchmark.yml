name: Central benchmark

on:
  workflow_dispatch:
    inputs:
      rust_sha:
        description: Manual Rust SHA (blank uses source lock; not used for SDK events)
        type: string
        default: ''
      go_sha:
        description: Manual Go SHA (blank uses source lock; not used for SDK events)
        type: string
        default: ''
      source_component:
        description: SDK main event component (rust or go)
        type: string
        default: ''
      source_sha:
        description: Exact SDK main push SHA
        type: string
        default: ''
      source_run_id:
        description: SDK main push caller run ID
        type: string
        default: ''
      request_id:
        description: Retry an existing request with its original resolved sources
        type: string
        default: ''

permissions:
  contents: read

env:
  SELECTED_RUST_SHA: ${{ inputs.rust_sha }}
  SELECTED_GO_SHA: ${{ inputs.go_sha }}
  SOURCE_COMPONENT: ${{ inputs.source_component }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  REQUEST_ID: ${{ inputs.request_id }}

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      request_id: ${{ steps.register.outputs.request_id }}
      should_run: ${{ steps.register.outputs.should_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Register and claim immutable request
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bench_requests.py register
      - name: Transfer canonical source selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: request-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ._runtime/sources.lock.json
            ._runtime/request.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  measure:
    needs: request
    if: needs.request.outputs.should_run == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    env:
      BENCH_RUNNER_PROVIDER: ubicloud
      BENCH_RUNNER_IMAGE: ubuntu24
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime
      - name: Capture measurement host with canonical source inputs
        run: python3 scripts/central_inputs.py --lock ._runtime/sources.lock.json --output ._runtime/sources.lock.json --environment-output ._runtime/environment.json
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify compatibility and measure both SDKs on this host
        run: |
          python3 scripts/measure.py --lock-file ._runtime/sources.lock.json \
            --environment ._runtime/environment.json --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Export official candidate bundle
        run: |
          python3 scripts/export_results.py "results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --environment ._runtime/environment.json --output ._runtime/bundle --channel official \
            --run-url "https://github.com/qortoo/qortoo-bench/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          cat "results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer validated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/*/*.json
            results/*/*.md
            results/*/*.log
            results/*/*.lock
            results/*/*.mod
            results/*/*.sum
            ._runtime/sources.lock.json
            ._runtime/environment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [request, measure]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Optimistic data-branch transactions preserve every request without a
    # concurrency group that could replace a pending publisher.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/bundle
      - name: Install Action runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch pinned tracking Action
        run: |
          git clone --no-checkout https://github.com/benchmark-action/github-action-benchmark.git ._runtime/action
          git -C ._runtime/action checkout --detach 4322e5726e6334590d251fc4f92bec0efafc45dc
      - name: Revalidate and atomically publish results and request outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_results.py --bundle ._runtime/bundle \
            --lock ._runtime/sources.lock.json --action-directory ._runtime/action
          cat ._runtime/publication.json >> "$GITHUB_STEP_SUMMARY"

  failure:
    needs: [request, measure, publish]
    if: always() && needs.request.outputs.should_run == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REQUEST_ID: ${{ needs.request.outputs.request_id }}
      FAILURE_STATUS: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || 'failed' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retrieve bounded failure diagnostics
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/diagnostics
      - name: Retain failed request without advancing successful results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bench_requests.py finish --status "$FAILURE_STATUS"
