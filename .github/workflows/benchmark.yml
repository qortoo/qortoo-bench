name: Central benchmark

on:
  workflow_dispatch:
    inputs:
      rust_sha:
        description: Full qortoo-rs commit SHA (blank uses sources.lock.json)
        type: string
        default: ''
      go_sha:
        description: Full qortoo-go commit SHA (blank uses sources.lock.json)
        type: string
        default: ''

permissions:
  contents: read

env:
  SELECTED_RUST_SHA: ${{ inputs.rust_sha }}
  SELECTED_GO_SHA: ${{ inputs.go_sha }}

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve fixed source inputs and record host
        run: python3 scripts/central_inputs.py --output ._runtime/sources.lock.json --environment-output ._runtime/environment.json
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Measure both SDKs on this host
        run: |
          python3 scripts/measure.py --lock-file ._runtime/sources.lock.json \
            --environment ._runtime/environment.json --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Export official candidate bundle
        run: |
          python3 scripts/export_results.py "results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --environment ._runtime/environment.json --output ._runtime/bundle --channel official \
            --run-url "https://github.com/qortoo/qortoo-bench/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          cat "results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer validated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/*/*.json
            results/*/*.md
            results/*/*.log
            ._runtime/sources.lock.json
            ._runtime/environment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: bench-data-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the same trusted source selection
        run: python3 scripts/central_inputs.py --output ._runtime/sources.lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/bundle
      - name: Install Action runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch pinned tracking Action
        run: |
          git clone --no-checkout https://github.com/benchmark-action/github-action-benchmark.git ._runtime/action
          git -C ._runtime/action checkout --detach 4322e5726e6334590d251fc4f92bec0efafc45dc
      - name: Revalidate and publish immutable results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_results.py --bundle ._runtime/bundle \
            --lock ._runtime/sources.lock.json --action-directory ._runtime/action
          cat ._runtime/publication.json >> "$GITHUB_STEP_SUMMARY"
