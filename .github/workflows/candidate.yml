name: PR candidate benchmark
run-name: "Candidate ${{ inputs.source_component }} PR #${{ inputs.source_pr }} at ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_component:
        description: SDK component (rust or go)
        type: choice
        options: [rust, go]
        required: true
      source_pr:
        description: SDK pull request number
        required: true
        type: string
      source_sha:
        description: Exact PR head SHA from the original event
        required: true
        type: string
      source_run_id:
        description: Successful SDK Benchmark PR event run ID
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate PR origin and freeze both source locks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMPONENT: ${{ inputs.source_component }}
          SOURCE_PR: ${{ inputs.source_pr }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 scripts/pr_inputs.py --output ._runtime/candidate-selection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime/candidate-selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    # Only duplicate requests for one head can cancel each other.
    concurrency:
      group: candidate-${{ inputs.source_component }}-${{ inputs.source_pr }}-${{ inputs.source_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    steps:
      - name: Fetch only the trusted central harness without credentials
        env:
          CENTRAL_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/qortoo/qortoo-bench.git
          git fetch --depth=1 origin "$CENTRAL_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ._runtime
      - name: Compare base and head on this host
        env:
          CANDIDATE_RUN_URL: https://github.com/qortoo/qortoo-bench/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          python3 scripts/candidate_compare.py --selection ._runtime/candidate-selection.json --output ._runtime/candidate
          cat ._runtime/candidate/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain candidate-only results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ._runtime/candidate/status.json
            ._runtime/candidate/selection.json
            ._runtime/candidate/execution-order.json
            ._runtime/candidate/comparison.*
            ._runtime/candidate/bundle-*/
            ._runtime/candidate/command-*.log
            ._runtime/candidate/failure-*/*.json
            ._runtime/candidate/failure-*/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
